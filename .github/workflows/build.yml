name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Generate Clean Android Scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org in.cinevorafilms --project-name cinevora_app .
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle || true
          flutter pub get

      - name: Compile Working Android APK
        run: flutter build apk --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVora-App
          path: build/app/outputs/flutter-apk/app-debug.apk
